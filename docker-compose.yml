# 先构建镜像：make docker-build-linux-amd64
# arm64 镜像标签是 bak:linux-arm64，由 make docker-build-linux-arm64 生成。
# 面板通过 ports 映射到宿主机 127.0.0.1。改端口时设置 BAIDUBAK_PORT，例如 BAIDUBAK_PORT=18080 docker compose up -d。
# 容器内固定监听 0.0.0.0:8080，端口映射才能转到进程；宿主机只绑定 127.0.0.1。
# 容器使用 bridge 网络，容器内的 127.0.0.1 不是宿主机。
# 连接宿主机上的 MySQL / Redis 时使用 host.docker.internal（extra_hosts 指向宿主机网关）。
# 这些服务若只监听 127.0.0.1，容器仍然访问不到，需要让它们监听 docker 网桥能到达的地址。
# 启用自带 MySQL / Redis 时，映射到宿主机的端口由 BAIDUBAK_MYSQL_PORT、BAIDUBAK_REDIS_PORT 控制，默认 3306 和 6379，只绑定 127.0.0.1。
# 应用通过服务名连接容器，端口仍是 3306 / 6379，与宿主机映射端口无关：
#   BAIDUBAK_MYSQL_DSN='root:@tcp(mysql:3306)/yy?charset=utf8mb4&parseTime=True&loc=Local' BAIDUBAK_REDIS_HOST=redis:6379
# 某一侧没有现成服务时再启用对应 profile，两侧都没有时一起启用：
#   docker compose --profile mysql up -d
#   docker compose --profile redis up -d
#   docker compose --profile mysql --profile redis up -d
# 覆盖内置 MySQL DSN 与 Redis 地址时，环境变量优先于挂载文件：
#   BAIDUBAK_MYSQL_DSN='user:pass@tcp(10.0.0.8:3306)/yy?charset=utf8mb4&parseTime=True&loc=Local' \
#   BAIDUBAK_REDIS_HOST=10.0.0.8:6379 BAIDUBAK_REDIS_USER=default BAIDUBAK_REDIS_PASSWORD=secret docker compose up -d
#   或在 bak.volumes 挂载配置：/path/to/conf.yaml:/app/conf.yaml:ro
#   挂到其他路径时设置 BAIDUBAK_CONFIG。

services:
  bak:
    image: bak:linux-amd64
    platform: linux/amd64
    ports:
      - "127.0.0.1:${BAIDUBAK_PORT:-8080}:8080"
    command: ["--addr", "0.0.0.0:8080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BAIDUBAK_ALLOW_UNSPECIFIED_ADDR: "1"
      # 没有宿主机 .env 时使用这些默认值。应用不要求容器内存在 /app/.env。
      BAIDUBAK_MYSQL_DSN: "${BAIDUBAK_MYSQL_DSN:-root:@tcp(host.docker.internal:3306)/yy?charset=utf8mb4&parseTime=True&loc=Local}"
      BAIDUBAK_REDIS_HOST: "${BAIDUBAK_REDIS_HOST:-host.docker.internal:6379}"
      BAIDUBAK_REDIS_USER: ${BAIDUBAK_REDIS_USER:-}
      BAIDUBAK_REDIS_PASSWORD: ${BAIDUBAK_REDIS_PASSWORD:-}
      BAIDUBAK_JWT_SECRET: ${BAIDUBAK_JWT_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    restart: unless-stopped

  mysql:
    profiles: ["mysql"]
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: yy
    ports:
      - "127.0.0.1:${BAIDUBAK_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--password=", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${BAIDUBAK_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
